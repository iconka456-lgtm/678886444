<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Билет</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back">←</button>
    <h1>Билет</h1>
  </div>
  <div class="divider"></div>

  <div class="content">
    <div class="status">Билет использован</div>

    <div class="route-row">
      <div class="route-edit">
        <div class="route-fields">
          <input class="route-input" id="fromInput" type="text" value="Санкт-Петербург (Финляндский вокзал)" placeholder="Откуда">
          <div class="route-sep">—</div>
          <input class="route-input" id="toInput" type="text" value="Пискарёвка" placeholder="Куда">
        </div>
        <button class="swap-btn" id="swapBtn" title="Поменять местами">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3v12M17 15l-4-4M17 15l4-4"/>
            <path d="M7 21V9M7 9l4 4M7 9L3 13"/>
          </svg>
        </button>
      </div>
      <div class="icon-badge">
        <svg viewBox="0 0 24 24"><path d="M4 15.5C4 17.43 5.57 19 7.5 19L6 20.5V21h1.6l1.5-1.5h5.8L16.4 21H18v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-3.58-4-8-4s-8 .5-8 4v9.5zM7.5 17c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM18 11H6V6h12v5z"/></svg>
      </div>
    </div>

    <div class="date">22 августа</div>
    <div class="valid">Действовал до 01:00 23 августа</div>

    <div class="barcode-wrap">
      <div class="barcode-card" id="barcode">
        <svg id="barcodeSvg" viewBox="0 0 340 130" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div class="hint">Нажмите на штрихкод, чтобы отразить его</div>

    <div class="type">Полный, в одну сторону</div>
    <div class="type-sub">Билет на электричку стандарт (обычный пригородный поезд)</div>
  </div>

  <div class="footer">
    <div class="price">65 ₽</div>
    <div class="ticket-no">Билет № 3682644418218</div>
  </div>
  <div class="helper">
    <span>Что делать, если билет не работает</span>
    <span class="chev">⌄</span>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="script.js"></script>
</body>
</html>
